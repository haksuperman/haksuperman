name: Update profile artwork

on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 0 * * *'

permissions:
  contents: write

concurrency:
  group: profile-artwork
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Pillow
        run: python -m pip install "Pillow==11.3.0"
      - name: Generate profile images
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/render_profile.py
      - name: Commit updated images
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add intro-terminal.svg contrib-heatmap.svg avatar-ascii.svg stats.svg contrib-3d.svg
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh profile artwork"
            git push
          fi
